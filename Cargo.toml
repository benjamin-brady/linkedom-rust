[package]
name = "linkedom-rust"
version = "0.0.0"
edition = "2021"
description = "Rust + WebAssembly DOM library targeting Cloudflare Workers (work-in-progress)."
repository = "https://github.com/benjamin-brady/linkedom-rust"
license = "MIT"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Filled in as implementation lands. See docs/superpowers/plans/.
# html5ever = "0.27"
# markup5ever = "0.12"
# wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
